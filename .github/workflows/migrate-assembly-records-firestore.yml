name: Migrate assembly records to Firestore

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify without writing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: migrate-assembly-records-firestore
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests firebase-admin==7.5.0
      - name: Require Firestore credentials
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is required." >&2
            exit 1
          fi
      - name: Validate source dataset
        run: python scripts/update_assembly_records.py --check-only
      - name: Migrate and verify
        if: inputs.verify_only == false
        run: python scripts/migrate_assembly_records_to_firestore.py
      - name: Verify existing Firestore dataset
        if: inputs.verify_only == true
        run: python scripts/migrate_assembly_records_to_firestore.py --verify-only
