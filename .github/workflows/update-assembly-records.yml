name: Update official assembly records

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-assembly-records.yml'
      - 'scripts/update_assembly_records.py'
      - 'scripts/validate_issue_catalog.py'
      - 'issue_catalog.py'
      - 'assembly_record_store.py'
      - 'assembly_records.py'
      - 'catalog_metadata.py'
      - 'scripts/migrate_assembly_records_to_firestore.py'
      - 'tests/test_assembly_record_store.py'
      - 'tests/test_update_assembly_records.py'
      - 'data/assembly_records.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-assembly-records
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests
      - name: Test ingestion and catalog integrity
        run: >-
          python -m unittest
          tests.test_assembly_record_store
          tests.test_update_assembly_records
          tests.test_issue_catalog
      - run: python scripts/validate_issue_catalog.py
      - run: python scripts/update_assembly_records.py --check-only
      - run: >-
          python scripts/update_assembly_records.py
          --auto-publish
          --max-records-per-assembly 100
          --ssp-years 3
      - name: Commit verified official records
        id: commit_records
        run: |
          if git diff --quiet -- data/assembly_records.json data/assembly_records_inbox.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/assembly_records.json data/assembly_records_inbox.json
          git commit -m "data: update official assembly records"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Sync versioned records to Firestore
        if: github.event_name == 'push' || steps.commit_records.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; keeping JSON as the active source."
            exit 0
          fi
          pip install firebase-admin==7.5.0
          python scripts/migrate_assembly_records_to_firestore.py
      - name: Trigger Render deploy
        if: steps.commit_records.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deploy."
          fi
