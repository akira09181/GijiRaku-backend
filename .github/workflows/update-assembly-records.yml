name: Update official assembly records

on:
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-assembly-records
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests
      - run: python -m unittest discover -s tests
      - run: python scripts/update_assembly_records.py --check-only
      - run: python scripts/update_assembly_records.py --auto-publish --max-records-per-assembly 50
      - name: Commit verified official records
        run: |
          if git diff --quiet -- data/assembly_records.json data/assembly_records_inbox.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/assembly_records.json data/assembly_records_inbox.json
          git commit -m "data: update official assembly records"
          git push
